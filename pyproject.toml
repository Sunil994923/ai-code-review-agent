[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-code-review-agent"
version = "0.1.0"
description = "LLM-powered pull request reviewer that posts structured, line-level review comments to GitHub"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sunil Kumar" }]
dependencies = [
    "anthropic>=2.3,<3",
    "httpx>=0.28.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
code-review-agent = "code_review_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
